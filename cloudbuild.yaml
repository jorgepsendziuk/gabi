# Deploy GABI API → Cloud Run (use este arquivo no trigger ou: gcloud builds submit)
# Requer: API habilitada, permissão Cloud Build + Cloud Run no projeto.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/gabi-api:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/gabi-api:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/gabi-api

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gabi
      - --image=gcr.io/$PROJECT_ID/gabi-api:$SHORT_SHA
      - --region=southamerica-east1
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/gabi-api:$SHORT_SHA
  - gcr.io/$PROJECT_ID/gabi-api:latest

options:
  logging: CLOUD_LOGGING_ONLY
